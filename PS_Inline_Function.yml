name: ps
on:
  workflow_dispatch:

jobs:
  run-pwsh-inline:
    runs-on: ubuntu-latest  # Works on ubuntu, macOS, or windows
    steps:
      - uses: actions/checkout@v4

      - name: Call inline PowerShell function and set output
        id: greet
        shell: pwsh
        run: |
          function Get-Greeting {
            param(
              [Parameter(Mandatory)][string]$Name,
              [ValidateSet('en','es','fr')][string]$Lang = 'en'
            )
            switch ($Lang) {
              'en' { "Hello, $Name!" }
              'es' { "¡Hola, $Name!" }
              'fr' { "Bonjour, $Name!" }
            }
          }

          $greeting = Get-Greeting -Name 'David' -Lang 'en'
          Write-Host "Greeting: $greeting"

          # Emit as step output
          "message=$greeting" >> $env:GITHUB_OUTPUT

      - name: Use the output in another step
        shell: pwsh
        run: echo "The PowerShell said: ${{ steps.greet.outputs.message }}"